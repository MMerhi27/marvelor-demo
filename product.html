<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvelor | Haircare</title>
    
    <link rel="icon" type="image/png" href="img/icon/icon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="brand"><img src="img/icon/logo.bg.png" alt="Marvelor"></a>

            <ul class="nav-links">
                <li><a href="index.html#shop">Shop</a></li>
                <li><a href="index.html#bundles">Bundles</a></li>
                <li><a href="index.html#our-story">Our Story</a></li>
            </ul>

            <button type="button" class="cart-button" aria-label="Open cart"><i class="bi bi-bag" aria-hidden="true"></i></button>
        </nav>
    </header>

    <main>
        <section class="product-details">
            <div class="container product-details-content">
                <div class="product-gallery"></div>

                <div class="product-details-info">
                    <h1 class="details-name"></h1>
                    <p class="details-size"></p>
                    <p class="details-price"></p>
                    <p class="details-description"></p>

                    <div class="product-actions">
                        <label for="product-quantity">Quantity</label>
                        <div class="product-quantity-controls">
                            <button type="button" class="quantity-minus" aria-label="Decrease quantity" disabled>-</button>
                            <input type="number" id="product-quantity" min="1" step="1" value="1" required>
                            <button type="button" class="quantity-plus" aria-label="Increase quantity">+</button>
                        </div>

                        <button type="button" class="add-to-cart">Add to Cart</button>
                    </div>
                    <div class="details-extra">
                        <h2>What's Included</h2>
                        <ul class="details-includes"></ul>

                        <h2>Key Benefits</h2>
                        <ul class="details-benefits"></ul>

                        <h2>How to Use</h2>
                        <p class="details-how-to-use"></p>

                        <h2>Recommended Use</h2>
                        <p class="details-recommended-use"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="site-footer">
        <div class="container footer-content">
            <a href="index.html" class="footer-brand">
                <img src="img/icon/logo.bg.png" alt="Marvelor">
            </a>

            <div class="footer-links">
                <a href="https://www.instagram.com/marvelor.lb?utm_source=ig_web_button_share_sheet&cplk=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer" aria-label="instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
                <a href="mailto:Adm.marvelor.lb@gmail.com" aria-label="Email us"><i class="bi bi-envelope-at" aria-hidden="true"></i></a>
            </div>

            <p class="copyright">© 2026 MARVELOR. All rights reserved.</p>
        </div>
    </footer>

    <dialog class="cart-panel" aria-labelledby="cart-title">
        <div class="cart-header">
            <h2 id="cart-title">Your Cart</h2>
            <button type="button" class="cart-close" aria-label="Close cart">Close</button>
        </div>

        <div class="cart-items"></div>
        <div class="cart-summary">
            <p>Subtotal: <span class="cart-total">$0</span></p>
            <button type="button" class="checkout-button" disabled>Checkout</button>
        </div>
    </dialog>

    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
